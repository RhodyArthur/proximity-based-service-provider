<div class="flex flex-col gap-1">
  @if (label) {
  <label class="block text-sm font-medium text-gray-700"> {{ label }} </label>
  }

  <div class="relative flex items-center justify-center">
    <!-- Prefix Icon -->
    @if (prefixIcon) {
    <span class="absolute left-3 text-gray-400 pointer-events-none">
      <i [class]="prefixIcon"></i>
    </span>
    }

    <!-- Input -->
    <input
      [type]="type === 'password' ? (showPassword ? 'text' : 'password') : type"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="w-full pl-10 pr-10 py-3 border-2 border-gray-400 bg-white text-black rounded-md focus:outline-none focus:ring-1 focus:ring-[#0B4777] focus:border-blue-500 text-sm"
    />

    <!-- Password Eye Icon (default for type=password) -->
    @if (type === 'password') {
    <span
      class="absolute right-3 text-gray-600 cursor-pointer"
      (click)="togglePasswordVisibility()"
    >
      <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
    </span>
    }

    <!-- Other Suffix Icon (only if not password) -->
    @if (suffixIcon && type !== 'password') {
    <span
      class="absolute right-3 text-gray-400"
      [class.cursor-pointer]="suffixIconClickable"
      (click)="suffixIconClickable && onSuffixIconClick?.()"
    >
      <i [class]="suffixIcon"></i>
    </span>
    }
  </div>
</div>
