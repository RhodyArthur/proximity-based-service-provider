<app-auth>
  <main class="flex flex-col gap-8 p-4 w-full lg:w-[500px] lg:p-0" auth-content>
    <header class="flex flex-col">
      <h1 class="text-3xl text-black font-semibold">Log in to your Account</h1>
      <p class="text-gray-500 dark:text-gray-400">
        Welcome back, enjoy the services on our platform
      </p>
    </header>

    <form class="flex flex-col gap-8" [formGroup]="loginForm">
      <section class="flex flex-col gap-4">
        <div class="relative">
          <app-input-field
            label="Email"
            type="email"
            placeholder="you@example.com"
            prefixIcon="fas fa-envelope"
            formControlName="email"
          />
        </div>

        <div class="relative">
          <app-input-field
            label="Password"
            type="password"
            placeholder="●●●●●●●●●"
            prefixIcon="fas fa-lock"
            suffixIcon="eye"
            formControlName="password"
          />
          <a class="text-blue-900 text-base absolute right-0" routerLink="/auth/forgot-password"
            >Forgot Password?</a
          >
        </div>
      </section>

      <div class="flex flex-col gap-4 mt-2">
        <p-button label="SIGN IN" />

        <button
          class="bg-white border-2 rounded-[4px] text-sm py-[7px] border-blue-800 flex justify-center align-center gap-2 text-black uppercase"
        >
          <img src="./assets/Google.png" alt="google icon" />
          Sign in with google
        </button>

        <p class="text-base text-gray-400 text-center">
          Don't have an account?
          <a class="text-blue-900 cursor-pointer" routerLink="/auth/role-selection">SIGN UP</a>
        </p>
      </div>
    </form>
  </main>
</app-auth>
