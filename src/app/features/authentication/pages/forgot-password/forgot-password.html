<app-auth>
  <main class="flex flex-col gap-4 p-4 w-full lg:w-[500px] lg:p-0" auth-content>
    <header class="flex flex-col">
      <h1 class="text-3xl text-black font-semibold">Forgot password?</h1>
      <p class="text-gray-500 dark:text-gray-400">Enter your email address to reset password</p>
    </header>

    <form class="flex flex-col gap-4" [formGroup]="form">
      <div class="relative">
        <app-input-field
          label="Email"
          type="email"
          placeholder="you@example.com"
          prefixIcon="fas fa-envelope"
          formControlName="email"
        />
        <small class="block text-sm text-red-700 absolute top-0 right-0"
          >{{getError('email')}}</small
        >
      </div>

      <div class="flex flex-col gap-4 mt-2">
        <p-button label="VERIFY EMAIL" />

        <a
          class="bg-white border-2 rounded-[4px] text-sm py-[7px] border-blue-800 flex justify-center align-center gap-2 text-black uppercase"
          routerLink="/auth/login"
        >
          back to login
        </a>
      </div>
    </form>
  </main>
</app-auth>
