<app-auth>
  <main class="flex flex-col gap-8 p-4 w-full lg:w-[500px] lg:p-0" auth-content>
    <header class="flex flex-col">
      <h1 class="text-3xl text-black font-semibold">Reset Password</h1>
      <p class="text-gray-500 dark:text-gray-400">
        Your new password must be different from the previous ones
      </p>
    </header>

    <form class="flex flex-col gap-8" [formGroup]="resetForm">
      <section class="flex flex-col gap-4">
        <div class="relative">
          <app-input-field
            label="Password"
            type="password"
            placeholder="●●●●●●●●●"
            prefixIcon="fas fa-lock"
            suffixIcon="eye"
            formControlName="password"
          />
          <small class="block text-sm text-red-700 absolute top-0 right-0"
            >{{getError('password')}}</small
          >
        </div>

        <div class="relative">
          <app-input-field
            label="Confirm Password"
            type="password"
            placeholder="●●●●●●●●●"
            prefixIcon="fas fa-lock"
            suffixIcon="eye"
            formControlName="confirmPassword"
          />
          <small class="block text-sm text-red-700 absolute top-0 right-0"
            >{{getError('confirmPassword')}}</small
          >
        </div>
      </section>

      <div class="flex flex-col gap-4">
        <p-button label="RESET PASSWORD" />

        <a
          routerLink="/auth/login"
          class="bg-white border-2 rounded-[4px] text-sm py-[7px] border-blue-800 flex justify-center align-center gap-2 text-black uppercase"
        >
          back to login
        </a>
      </div>
    </form>
  </main>
</app-auth>
