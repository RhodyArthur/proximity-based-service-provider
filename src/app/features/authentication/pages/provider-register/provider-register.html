<app-auth>
  <main class="flex flex-col gap-8 p-4" auth-content>
    <div class="flex items-center gap-2 cursor-pointer" (click)="goBack()">
      <i class="fa-solid fa-arrow-left" style="color: #0b4777"></i>
      <p class="text-[#0b4777] font-medium">Back</p>
    </div>

    <header class="flex flex-col">
      <h1 class="text-3xl text-black font-semibold">Register for an Account</h1>
      <p class="text-gray-500 dark:text-gray-400">
        Complete your registration with us to offer your services on our platform
      </p>
    </header>

    <form class="flex flex-col gap-8" [formGroup]="registerForm">
      <section class="flex flex-col gap-4">
        <div class="relative">
          <app-input-field
            label="Business Name"
            type="text"
            placeholder="Lazo Washing Bay"
            prefixIcon="fas fa-user"
            formControlName="businessName"
          />
          <small class="block text-sm text-red-700 absolute top-0 right-0"
            >{{getError('businessName')}}</small
          >
        </div>

        <div class="relative">
          <app-input-field
            label="Business Email"
            type="email"
            placeholder="you@example.com"
            prefixIcon="fas fa-envelope"
            formControlName="businessEmail"
          />
          <small class="block text-sm text-red-700 absolute top-0 right-0"
            >{{getError('businessEmail')}}</small
          >
        </div>

        <div class="relative">
          <app-input-field
            label="Password"
            type="password"
            placeholder="●●●●●●●●●"
            prefixIcon="fas fa-lock"
            suffixIcon="eye"
            formControlName="password"
          />
          <small class="block text-sm text-red-700 absolute top-0 right-0"
            >{{getError('password')}}</small
          >
        </div>

        <div class="relative">
          <app-input-field
            label="Confirm Password"
            type="password"
            placeholder="●●●●●●●●●"
            prefixIcon="fas fa-lock"
            suffixIcon="eye"
            formControlName="confirmPassword"
          />
          <small class="block text-sm text-red-700 absolute top-0 right-0"
            >{{getError('confirmPassword')}}</small
          >
        </div>
      </section>

      <div class="flex flex-col gap-4">
        <p-button label="REGISTER" />

        <button
          class="bg-white border-2 rounded-[4px] text-sm py-[7px] border-blue-800 flex justify-center align-center gap-2 text-black uppercase"
        >
          <img src="./assets/Google.png" alt="google icon" />
          Sign in with google
        </button>

        <p class="text-base text-gray-400 text-center">
          Already have a Provider account?
          <a class="text-blue-900 cursor-pointer" routerLink="/auth/login">SIGN IN</a>
        </p>
      </div>
    </form>
  </main>
</app-auth>
